<svg width="342px" height="342px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid" style="background: none; overflow: visible;">
  <style>
    .sad-mascot-group {
      transform-origin: 50px 50px;
      will-change: transform;
      animation: ld-swim-px 3s ease-in-out infinite;
    }
    @keyframes ld-swim-px {
      0%, 50%, 100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }
      12.5%, 37.5% {
        transform: translate3d(0, -2px, 0) rotate(3.5deg);
      }
      25% {
        transform: translate3d(0, -3px, 0) rotate(6deg);
      }
      62.5%, 87.5% {
        transform: translate3d(0, 2px, 0) rotate(-3.5deg);
      }
      75% {
        transform: translate3d(0, 3px, 0) rotate(-6deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .sad-mascot-group {
        animation: none !important;
      }
    }
  </style>
  <g class="sad-mascot-group">
    <!-- Face Head -->
    <circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-miterlimit="10"/>
    <!-- Sad Curved Mouth -->
    <path d="M31.866,71.591c2.57-7.556,9.709-13,18.134-13s15.564,5.444,18.134,13" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none" stroke-miterlimit="10"/>
    <!-- Left Eye X -->
    <line x1="27.5" y1="32.409" x2="39.5" y2="44.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10"/>
    <line x1="27.5" y1="44.409" x2="39.5" y2="32.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10"/>
    <!-- Right Eye X -->
    <line x1="60.5" y1="32.409" x2="72.5" y2="44.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10"/>
    <line x1="60.5" y1="44.409" x2="72.5" y2="32.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10"/>
  </g>
</svg>
