<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintBooth — Printer Offline</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #06110D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .kiosk-bg-mesh {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(200, 255, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 255, 0, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    #oopss {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #06110D;
      padding: 24px;
    }
    #error-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
    }
    .oopss-mascot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .oopss-mascot-animator {
      animation: mascotHover 3s ease-in-out infinite;
      will-change: transform;
    }
    .sad-mascot-svg {
      width: clamp(140px, 20vw, 210px);
      height: clamp(140px, 20vw, 210px);
      display: block;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.8));
    }
    .mascot-ground-shadow {
      width: clamp(90px, 14vw, 150px);
      height: 14px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      margin-top: 10px;
      animation: shadowScale 3s ease-in-out infinite;
      will-change: transform, opacity;
    }
    @keyframes mascotHover {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-16px);
      }
    }
    @keyframes shadowScale {
      0%, 100% {
        transform: scale(1);
        opacity: 0.65;
      }
      50% {
        transform: scale(0.72);
        opacity: 0.3;
      }
    }
    .oopss-title {
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }
    .oopss-sub {
      font-size: 1.05rem;
      color: #94a3b8;
      max-width: 460px;
      line-height: 1.5;
    }
    .reconnecting-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(200, 255, 0, 0.08);
      border: 1px solid rgba(200, 255, 0, 0.25);
      color: #c8ff00;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .spinner-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #c8ff00;
      box-shadow: 0 0 10px #c8ff00;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
</head>
<body>
  <div class="kiosk-bg-mesh"></div>
  <div id="oopss">
    <div id="error-text">
      <div class="oopss-mascot-container">
        <div class="oopss-mascot-animator">
          <svg class="sad-mascot-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="40" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-miterlimit="10" />
            <path d="M31.866,71.591c2.57-7.556,9.709-13,18.134-13s15.564,5.444,18.134,13"
                  stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none" stroke-miterlimit="10" />
            <line x1="27.5" y1="32.409" x2="39.5" y2="44.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10" />
            <line x1="27.5" y1="44.409" x2="39.5" y2="32.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10" />
            <line x1="60.5" y1="32.409" x2="72.5" y2="44.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10" />
            <line x1="60.5" y1="44.409" x2="72.5" y2="32.409" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-miterlimit="10" />
          </svg>
        </div>
        <div class="mascot-ground-shadow"></div>
      </div>
      <div class="oopss-title">PRINTER OFFLINE</div>
      <div class="oopss-sub">Station offline or waiting for network reconnection.</div>
      <div class="reconnecting-pill">
        <span class="spinner-dot"></span>
        <span>Auto-Reconnecting…</span>
      </div>
    </div>
  </div>
  <script>
    // Automatic recovery watchdog
    function probeRecovery() {
      fetch('/api/printer/status', { cache: 'no-store' })
        .then(function(res) {
          if (res.ok) {
            window.location.href = '/';
          }
        })
        .catch(function() {});
    }
    setInterval(probeRecovery, 3000);
    window.addEventListener('online', function() {
      probeRecovery();
      setTimeout(function() { window.location.href = '/'; }, 1000);
    });
  </script>
</body>
</html>
